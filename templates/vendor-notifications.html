{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div class="eyebrow">SYNBYTE</div><h1>Vendor notifications</h1><p class="muted">Paid orders and operational updates.</p></div><div class="section-title"><h2>Inbox</h2><form method="post" action="{{url_for('mark_read')}}"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="id" value="all"><button class="button soft small">Mark all read</button></form></div><button id="allowNotifications" class="button soft small" type="button">Enable browser notifications</button><div class="notifs section">{% for n in messages %}<article class="notification {% if not n['read_at'] %}unread{% endif %}"><div class="section-title" style="margin:0 0 5px"><strong>{{n['title']}}</strong><span class="muted small">{{n['created'][:19].replace('T',' ')}}</span></div><p class="muted">{{n['body']}}</p><a class="red small" href="{{n['href']}}">View related page →</a></article>{% else %}<div class="card muted">No notifications yet.</div>{% endfor %}</div>
{% endblock %}
