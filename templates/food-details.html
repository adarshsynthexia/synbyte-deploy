{% extends 'base.html' %}
{% block content %}
<a href="{{url_for('food_menu')}}" class="red small">← Back to menu</a><div class="two-col section"><div class="card"><img class="pic-preview" src="{{image_url(food['image'])}}" alt="Food photograph of {{food['name']}}" style="width:100%;height:340px;object-fit:cover"></div><div class="card"><div class="eyebrow">{{food['category']}} · {{food['vendor_name']}}</div><h1>{{food['name']}}</h1><p class="muted">{{food['description']}}</p><h2 class="red">{{money(food['price'])}}</h2><div class="notice">Pickup only · One vendor per order</div><div class="section"><form method="post" action="{{url_for('add_cart')}}"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="food_id" value="{{food['id']}}"><input type="hidden" name="change" value="1"><button class="button block">Add to cart →</button></form></div><div class="section"><form method="post" action="{{url_for('toggle_favorite',food_id=food['id'])}}"><input type="hidden" name="_csrf" value="{{csrf}}"><button class="button soft block">{{'Remove from favorites' if liked else '♡ Save to favorites'}}</button></form></div></div></div>
{% endblock %}
