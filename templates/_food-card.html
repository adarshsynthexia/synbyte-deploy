{% macro card(food,csrf='',fav=False) %}
<article class="food-card"><a class="food-media" href="{{url_for('food_details',food_id=food['id'])}}"><img src="{{ image_url(food['image']) }}" loading="lazy" alt="{{food['name']}} — photo may require internet"><span class="tag">Fresh pick</span></a><div class="food-body"><div class="food-veg">▣ VEG · {{food['category']}}</div><h3><a href="{{url_for('food_details',food_id=food['id'])}}">{{food['name']}}</a></h3><div class="food-subtitle">{{food['vendor_name']}}</div><div class="food-price"><strong>{{money(food['price'])}}</strong>{% if user and user['role']=='student' %}<form method="post" action="{{url_for('add_cart')}}"><input type="hidden" name="_csrf" value="{{csrf}}"><input type="hidden" name="food_id" value="{{food['id']}}"><input type="hidden" name="change" value="1"><button class="button soft small" type="submit">+ ADD</button></form>{% else %}<a class="button soft small" href="{{url_for('student_login')}}">View</a>{% endif %}</div></div></article>
{% endmacro %}
