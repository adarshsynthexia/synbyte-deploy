{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div class="eyebrow">SYNBYTE</div><h1>Add a new dish</h1><p class="muted">Upload an original or properly licensed dish photo.</p></div><div class="card"><form method="post" action="{{url_for('vendor_add_food_post')}}" enctype="multipart/form-data"><input type="hidden" name="_csrf" value="{{csrf}}">{% set food=None %}<div class="form-grid"><div class="field"><label>Dish name</label><input name="name" value="{{food['name'] if food else ''}}" required maxlength="90"></div><div class="field"><label>Price (₹)</label><input name="price" type="number" value="{{food['price'] if food else ''}}" min="1" max="10000" required></div><div class="field"><label>Category</label><select name="category" required>{% for c in categories %}<option value="{{c}}" {% if food and food['category']==c %}selected{% endif %}>{{c}}</option>{% endfor %}<option value='Other'>Other — add custom category</option></select><input name='custom_category' placeholder='Optional: custom category' aria-label='Custom category'></div><div class="field"><label>Food photo {% if food %}(optional replacement){% endif %}</label><input type="file" name="image" accept="image/jpeg,image/png,image/webp" {% if not food %}required{% endif %}><div class="form-hint">Upload a photo you have permission to use. Min 320×220px.</div></div></div><div class="field"><label>Description</label><textarea name="description" required maxlength="250">{{food['description'] if food else ''}}</textarea></div><button class="button">Save dish →</button></form></div>
{% endblock %}
