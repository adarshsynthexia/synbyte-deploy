{% extends 'base.html' %}
{% block content %}
<div class="page-head"><div class="eyebrow">SYNBYTE</div><h1>Choose a new password</h1><p class="muted">Password recovery link expires after 20 minutes.</p></div><div class="card" style="max-width:540px"><form action="{{url_for('reset_password_post',token=token)}}" method="post"><input type="hidden" name="_csrf" value="{{csrf}}"><div class="field"><label for="password">New password (10+ characters)</label><input id="password" name="password" type="password" placeholder="New password" required minlength="10"></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" name="confirm" type="password" placeholder="Repeat password" required minlength="10"></div><button class="button">Update password</button></form></div>
{% endblock %}
